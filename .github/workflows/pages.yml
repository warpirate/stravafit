# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Publishes web/ to GitHub Pages: the live-location viewer (web/live/) and the
# group-invite landing page (web/join/). Supabase's own domain serves Edge
# Function HTML as text/plain, so the `live` and `join` functions redirect page
# requests here and keep only their JSON endpoints.
#
# One-time setup: repository Settings > Pages > Build and deployment >
# Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
