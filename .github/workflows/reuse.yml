# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Licence and header compliance (blueprint §12, ADR-007/010): every file must
# resolve to a licence and copyright via SPDX headers or REUSE.toml.
# Runs on every change, because any new file can break compliance.
name: REUSE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reuse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: REUSE lint
        uses: fsfe/reuse-action@v5
