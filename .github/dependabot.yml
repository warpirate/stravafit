#
# Dependabot is used only for GitHub Actions versions. Gradle, npm and other
# dependencies are handled by Renovate (renovate.json), which has the Actions
# manager disabled so the two bots never open duplicate PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
