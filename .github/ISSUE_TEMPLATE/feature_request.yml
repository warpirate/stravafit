# SPDX-License-Identifier: AGPL-3.0-or-later
name: Feature request
description: Propose something new that is not already a row in the parity checklist.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check `docs/08-blueprint/feature-parity-checklist.md`. If the feature is already listed, or another app has it and we are missing it, use the **Parity gap** template instead.
        Everything we build is free (ADR-001), so there is no "premium" option.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour in your own words. Do not paste text or screenshots from other apps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Does this touch location, health or social data? Who can see what? What are the defaults?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording
        - Save / edit / activity detail
        - Share and export
        - Profile / progress / training
        - Social
        - Segments
        - Maps and routes
        - Privacy and safety
        - Notifications / settings / platform
        - Backend / self-hosting
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the parity checklist.
          required: true
